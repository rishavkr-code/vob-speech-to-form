name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vob-speech-to-form .
      # Start the image the way the host does (non-root, PORT set) and check it serves.
      - name: Smoke test container
        run: |
          docker run -d --name app -e PORT=10000 -p 10000:10000 vob-speech-to-form
          for i in $(seq 1 30); do
            curl -fsS localhost:10000/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
